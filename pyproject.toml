[project]
name = "onboarding-agent"
version = "0.1.0"
description = "Orquestador multi-agente de onboarding digital bancario"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.8",
  "mangum>=0.19",
  "anthropic>=0.40",
  "openai>=1.50",
  "boto3>=1.35",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "uvicorn>=0.30", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
